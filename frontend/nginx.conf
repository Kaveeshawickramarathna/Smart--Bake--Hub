server {
    listen 80;
    
    # Root directory and index files
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Serve static files and fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
        
        # Kill cache for index.html to ensure users always get the latest bundle
        if ($request_uri ~* ^/($|index\.html)) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy uploads requests to the backend container
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
