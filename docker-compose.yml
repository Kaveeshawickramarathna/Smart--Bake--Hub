version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart_bake_hub_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: smart_bake_hub
    volumes:
      - ./database/schema_utf8.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_bake_hub_backend
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=password
      - DB_NAME=smart_bake_hub
      - DB_PORT=3306
      - PORT=5000
      - JWT_SECRET=your_jwt_secret_here
      - GEMINI_API_KEY=your_gemini_api_key_here
      - EMAIL_USER=wijayabakehouse@gmail.com
      - EMAIL_PASS=ejjg jovn wzld tnrl
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/src:/app/src
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_bake_hub_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
